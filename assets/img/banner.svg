<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="100%" height="auto">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="480" height="160" rx="18" fill="url(#bannerBg)"/>

  <!-- Decorative glow circles -->
  <circle cx="430" cy="30" r="80" fill="#8B5CF6" fill-opacity="0.25"/>
  <circle cx="60" cy="140" r="60" fill="#10B981" fill-opacity="0.15"/>
  <circle cx="240" cy="80" r="120" fill="#6366F1" fill-opacity="0.12"/>

  <!-- Official Tag -->
  <rect x="24" y="20" width="160" height="24" rx="6" fill="url(#badgeGrad)"/>
  <text x="104" y="36" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">100% OFFICIAL PLANS</text>

  <!-- Main Headline -->
  <text x="24" y="74" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    ALL OPERATOR PLANS
  </text>

  <!-- Offer Description -->
  <text x="24" y="98" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600" fill="#CBD5E1">
    Jio • Airtel • Vi • BSNL <tspan fill="url(#goldGrad)" font-weight="800">Prepaid Recharges</tspan>
  </text>
  <text x="24" y="120" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
    Unlimited 5G • Binge Night Data • 365 Days Packs
  </text>

  <!-- Instant badge on right -->
  <g transform="translate(360, 42)">
    <rect x="0" y="0" width="96" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="48" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle">INSTANT</text>
    <text x="48" y="50" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#34D399" text-anchor="middle">ACTIVATION</text>
    <text x="48" y="66" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#E2E8F0" text-anchor="middle">ZERO FEE</text>
  </g>

  <!-- Stars / sparkles -->
  <polygon points="190,24 193,30 200,30 194,34 196,40 190,36 184,40 186,34 180,30 187,30" fill="#FDE047" fill-opacity="0.8"/>
  <polygon points="330,120 332,125 338,125 333,128 335,133 330,130 325,133 327,128 322,125 328,125" fill="#34D399" fill-opacity="0.8"/>
</svg>
