<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#371065" />
    <link rel="icon" type="image/svg+xml" href="assets/img/brand.svg" />
    <meta
      name="description"
      content="SwiftRecharge – Choose from 100% authentic mobile recharge plans for Jio, Airtel, Vi, and BSNL."
    />
    <title>Select Official Recharge Plan – SwiftRecharge</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/common.css" />
    <link rel="stylesheet" href="assets/css/plans.css" />
  </head>
  <body>
    <!-- SVG Sprite -->
    <svg width="0" height="0" style="position: absolute; overflow: hidden; display: none;">
      <symbol id="icon-bolt" viewBox="0 0 24 24">
        <path d="M13.2 2.2 4.9 13.1c-.5.7 0 1.7.9 1.7h5.1l-.8 6.1c-.1.9 1.1 1.3 1.6.6l7.4-10.8c.5-.7 0-1.6-.9-1.6h-4.6l1.1-6.2c.2-.9-1-1.4-1.5-.7Z" />
      </symbol>
      <symbol id="icon-back" viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8Zm1-13h-2v6l5.1 3.1 1-1.7-4.1-2.5Z" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z" />
      </symbol>
      <symbol id="icon-data" viewBox="0 0 24 24">
        <path d="M12 3a9 9 0 0 0-9 9h2a7 7 0 0 1 14 0h2a9 9 0 0 0-9-9Zm0 4a5 5 0 0 0-5 5h2a3 3 0 0 1 6 0h2a5 5 0 0 0-5-5Zm0 4a1.5 1.5 0 1 0 1.5 1.5A1.5 1.5 0 0 0 12 11Zm-1 4v6h2v-6Z" />
      </symbol>
      <symbol id="icon-call" viewBox="0 0 24 24">
        <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.8 11.8 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.8 11.8 0 0 0 .57 3.6 1 1 0 0 1-.25 1Z" />
      </symbol>
      <symbol id="icon-message" viewBox="0 0 24 24">
        <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2ZM6 7h12v2H6Zm0 4h9v2H6Z" />
      </symbol>
      <symbol id="icon-sparkle" viewBox="0 0 24 24">
        <path d="m12 2 1.7 5.3L19 9l-5.3 1.7L12 16l-1.7-5.3L5 9l5.3-1.7ZM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="m13.2 5.3-1.4 1.4 4.3 4.3H4v2h12.1l-4.3 4.3 1.4 1.4 6.7-6.7Z" />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m9.2 16.6-4.5-4.5-1.4 1.4 5.9 5.9L21 7.6l-1.4-1.4Z" />
      </symbol>
    </svg>

    <div class="app">
      <!-- App Header -->
      <header class="header">
        <div class="header-left">
          <a href="index.html" class="header-button" aria-label="Go Back">
            <svg viewBox="0 0 24 24"><use href="#icon-back"></use></svg>
          </a>
          <div class="brand-text">
            <div class="brand-title">Official Plans</div>
            <div class="brand-subtitle">100% Authentic Prepaid Plans</div>
          </div>
        </div>
        <div class="header-actions">
          <a href="index.html" class="header-brand">
            <div class="brand-mark">
              <img class="brand-logo" src="assets/img/brand.svg" width="38" height="38" alt="SwiftRecharge" />
            </div>
          </a>
        </div>
      </header>

      <!-- User & Operator Info Strip -->
      <section class="user-info-bar">
        <div class="user-info-left">
          <div class="user-operator-logo">
            <img id="displayLogo" src="assets/img/jio.svg" alt="Operator" />
          </div>
          <div class="user-details">
            <span id="displayMobile" class="user-number">+91 00000 00000</span>
            <span id="displayOperator" class="user-operator-tag">Jio Prepaid</span>
          </div>
        </div>
        <a href="index.html" class="change-btn">Change</a>
      </section>

      <!-- Synchronized Offer Countdown Bar -->
      <section class="offer-bar">
        <div class="offer-left">
          <div class="offer-icon">
            <svg viewBox="0 0 24 24"><use href="#icon-clock"></use></svg>
          </div>
          <div class="offer-title">Instant Activation Window</div>
        </div>
        <div id="time" class="timer-value">10:00</div>
      </section>

      <!-- Category Filter Tabs -->
      <div class="tabs-scroll-wrap">
        <div class="tabs-list" role="tablist">
          <button class="tab-pill active" data-category="all" role="tab">All Plans</button>
          <button class="tab-pill" data-category="recommended" role="tab">Recommended</button>
          <button class="tab-pill" data-category="unlimited" role="tab">Truly Unlimited</button>
          <button class="tab-pill" id="specialTab" data-category="special" role="tab">5G Unlimited</button>
          <button class="tab-pill" data-category="annual" role="tab">Annual (365D)</button>
        </div>
      </div>

      <!-- Dynamically Populated Plans List -->
      <main class="plans-container" id="plansList">
        <!-- Rendered by plans.js -->
      </main>
    </div>

    <!-- Animated Loader Overlay Modal -->
    <div id="loaderOverlay" class="loader-overlay" role="dialog" aria-modal="true" aria-labelledby="loaderText">
      <div id="loaderCard" class="loader-card">
        <div id="loadingAnimation" class="loading-animation">
          <span class="spinner-ring"></span>
          <span class="spinner-core">
            <svg viewBox="0 0 24 24"><use href="#icon-bolt"></use></svg>
          </span>
        </div>
        <div id="loaderText" class="loader-title">Opening Secure Checkout</div>
        <div id="loaderSubText" class="loader-subtitle">Connecting with authentic billing gateway…</div>
        <div class="loader-progress"><span></span></div>
      </div>
    </div>

    <script src="assets/js/plans.js"></script>
  </body>
</html>
